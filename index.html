<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas on-line · Fluxo Djalma</title>
<meta name="description" content="Qual é a minha aula agora? Relógio, contagem regressiva e cronograma por professor ou turma · 12 e 13/11 · E.E. Profº Djalma Octaviano">
<meta name="theme-color" content="#14213d">
<!-- Prévia no WhatsApp: troque o endereço abaixo se o seu site tiver outro nome -->
<meta property="og:type" content="website">
<meta property="og:title" content="Aulas on-line · Qual é a minha aula?">
<meta property="og:description" content="Relógio ao vivo e contagem regressiva de cada aula · 12 e 13/11 · por professor ou turma (2A, 2B, 3A, 3B, 3C).">
<meta property="og:image" content="https://aulas-on-line.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://aulas-on-line.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d;--navy2:#22335a;--gold:#c9a227;--gold-d:#9c7c16;--gold-soft:#f7f1dc;
  --ink:#1b2333;--mut:#5f6b7d;--faint:#8a94a6;--line:#e2e6ec;--line2:#eef1f5;--bg:#f3f4f7;--card:#fff;
  --ok:#1f7a4d;--ok-soft:#e9f4ee;--warn:#9a6400;--warn-soft:#fbf4e4;--ev:#9a5a12;--ev-soft:#fbf3e6;
  --c0:#2f5d8a;--c1:#2b7a70;--c2:#a8642a;--c3:#8a3a50;--c4:#56528e;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;--sh:0 1px 2px rgba(20,33,61,.06),0 1px 1px rgba(20,33,61,.04);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 0 56px}
.pad{padding:0 16px}
svg{flex:none}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

/* ---------- cabeçalho institucional ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
h1{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.sub{font-size:.72rem;color:#c3cad8;margin-top:2px}
.seal{width:52px;height:52px;flex:none;perspective:400px}
.seal .spin{width:100%;height:100%;transform-style:preserve-3d;animation:spin3d 10s cubic-bezier(.6,0,.3,1) infinite}
.seal img,.seal svg{width:100%;height:100%;object-fit:contain;display:block}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.digits{display:flex;align-items:baseline;gap:1px;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.dg{font-size:1.45rem;color:#fff;letter-spacing:-.02em}
.dg.s{font-size:.9rem;color:var(--gold);margin-left:4px}
.colon{color:#8d99b3;font-size:1.3rem}
.date{font-size:.7rem;color:#c3cad8}
.date::first-letter{text-transform:uppercase}

/* ---------- painel de status ---------- */
.stage{margin:0 16px 18px}
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.hero.now{border-left-color:var(--ok)}.hero.next{border-left-color:var(--gold)}.hero.brk{border-left-color:var(--faint)}.hero.ev{border-left-color:var(--ev)}.hero.done{border-left-color:var(--faint)}
.hrow{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:var(--line2)}
.ring .fg{stroke:var(--navy);transition:stroke-dashoffset 1s linear}
.hero.now .fg{stroke:var(--ok)}.hero.next .fg{stroke:var(--gold)}.hero.ev .fg{stroke:var(--ev)}.hero.brk .fg,.hero.done .fg{stroke:var(--faint)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ring .unit{font-size:.6rem;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;max-width:78px}
.htxt{min-width:0}
.kick{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kick i{display:none}
.hero.now .kick{color:var(--ok)}.hero.next .kick{color:var(--gold-d)}.hero.ev .kick{color:var(--ev)}
.htitle{font-size:1.2rem;font-weight:700;margin-top:4px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hsub{font-size:.82rem;color:var(--mut);margin-top:4px}
.hafter{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2);font-size:.8rem;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hafter b{font-family:var(--mono);color:var(--ink);font-weight:600}

/* ---------- turmas ---------- */
.thead{display:flex;align-items:baseline;justify-content:space-between;margin:0 16px 8px}
.thead b{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);font-weight:700}
.thead small{font-size:.72rem;color:var(--faint)}
.turmas{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin:0 16px 18px}
.tc{min-width:0;position:relative;border:1px solid var(--line);border-top:4px solid var(--c);font:inherit;cursor:pointer;color:var(--ink);text-align:left;border-radius:10px;padding:10px 9px 9px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card);box-shadow:0 2px 0 #dfe3ea,var(--sh);transition:transform .12s,box-shadow .12s,opacity .2s}
.tc:hover{transform:translateY(-1px);box-shadow:0 3px 0 #d6dbe4,0 6px 12px -6px rgba(20,33,61,.18)}
.tc:active{transform:translateY(2px);box-shadow:0 0 0 #dfe3ea}
.tc .tn{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--c)}
.tc .tn sup{font-size:.55em;margin-left:1px}
.tc .st{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:8px;display:block}
.tc .who{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .cdm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:.68rem;color:var(--mut);display:inline-block;margin-top:2px}
.tc .cdm:empty{display:none}
.tc .live{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--ok);display:none}
.tc.isnow .live{display:block}
.tc.isnow .st{color:var(--ok)}
.tc.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#000),var(--sh)}
.tc.on .tn,.tc.on .st,.tc.on .cdm{color:#fff}
.tc.on .live{background:#fff}
.turmas.has-sel .tc:not(.on){opacity:.55}

/* ---------- busca ---------- */
.search{position:relative;margin:0 16px 8px;z-index:6}
.box{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:52px;padding:7px 12px 7px 44px;cursor:text;transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.12)}
.box>svg{position:absolute;left:15px;top:16px}
.box input{flex:1;min-width:130px;border:0;outline:0;font:inherit;font-size:1rem;background:none;padding:6px 2px;color:var(--ink)}
.box input::placeholder{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:.88rem;font-weight:600;padding:4px 6px 4px 5px;border-radius:8px}
.pill .av{width:22px;height:22px;font-size:.6rem;background:rgba(255,255,255,.2)!important}
.pill button{border:0;background:rgba(255,255,255,.22);color:#fff;width:18px;height:18px;border-radius:50%;font-size:.7rem;line-height:18px;padding:0;cursor:pointer}
.menu{position:absolute;left:0;right:0;top:calc(100% + 6px);padding:6px;max-height:340px;overflow:auto;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .12s,transform .12s;box-shadow:0 12px 28px -8px rgba(20,33,61,.25)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.grp{display:flex;align-items:center;gap:6px;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:500}
.opt .grow{flex:1}
.opt small{color:var(--faint);font-size:.72rem}
.opt.hi{background:#eef2f8}
.opt mark{background:none;color:var(--navy);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.none{padding:12px 10px;color:var(--mut);font-size:.9rem}

.tb{display:inline-flex;align-items:center;justify-content:center;min-width:34px;font-weight:700;font-size:.74rem;color:#fff;padding:3px 7px;border-radius:6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.68rem;flex:none}
.legend{display:none}

/* ---------- dias ---------- */
.days{display:grid;grid-template-columns:repeat(var(--nd),1fr);margin:14px 16px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.day{font:inherit;cursor:pointer;border:0;background:none;padding:10px 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;border-right:1px solid var(--line);transition:background .15s}
.day:last-child{border-right:0}
.day:hover{background:#f6f8fb}
.day b{font-size:1.05rem;color:var(--ink);font-weight:700}
.day span{font-size:.72rem;font-weight:500}
.day .hj{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;color:var(--gold-d)}
.day.on{background:var(--navy);color:#c3cad8;box-shadow:inset 0 -3px 0 var(--gold)}
.day.on b{color:#fff}
.day.on .hj{color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 12px}
.stat{padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.stat .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:#eef1f6;color:var(--navy)}
.stat b{font-size:1.1rem;font-weight:600;font-family:var(--mono)}
.stat small{font-size:.7rem;color:var(--mut)}

/* ---------- linha do tempo ---------- */
#out{transition:opacity .15s}
#out.fade{opacity:0}
.tl{margin:0 16px;padding:8px 12px 8px 6px}
.row{display:grid;grid-template-columns:56px 20px 1fr;align-items:center;min-height:58px}
.tm{text-align:right;line-height:1.2;padding-right:2px}
.tm b{display:block;font-size:.9rem;font-weight:600;font-family:var(--mono)}
.tm small{font-size:.66rem;color:var(--faint);white-space:nowrap}
.rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.row:first-child .rail::before{top:50%}.row:last-child .rail::before{bottom:50%}
.dot{position:relative;align-self:center;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid #c3cad6;z-index:1}
.body{padding:5px 0 5px 8px;min-width:0}
.item{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:10px 12px 12px;border-radius:9px;overflow:hidden;background:#fafbfc;border:1px solid var(--line2);border-left:4px solid #c3cad6}
.item .arrow{color:var(--faint)}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{margin-left:auto;flex:none;font-family:var(--mono);font-size:.7rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width 1s linear}
.item.free{background:none;border:1px dashed #d3d8e1;color:var(--faint);font-size:.85rem;padding:9px 12px}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;width:100%}
.cell{border-radius:6px;padding:5px 7px;font-size:.8rem;font-weight:600;background:#fff;border:1px solid var(--line2);border-top:3px solid;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;font-size:.62rem;font-weight:700;margin-bottom:1px}
.allwrap{width:100%}
.allhead{display:flex;justify-content:flex-end;margin-bottom:5px}

.row.past .item{opacity:.55}.row.past .tm{opacity:.55}
.row.past .bar i{background:#c3cad6}
.row.now .dot{border-color:var(--ok);background:var(--ok)}
.row.now .item{background:var(--ok-soft);border-color:#cfe5d8}
.row.now .cd{color:var(--ok);font-weight:600}
.row.next .dot{border-color:var(--gold)}
.row.next .cd{color:var(--gold-d);font-weight:600}

.brk .item{background:none;border:0;padding:4px;color:var(--mut);font-size:.8rem;gap:8px}
.brk .dot{width:8px;height:8px;border-width:2px}
.brk .cd{display:none}
.row.brk.now .cd{display:inline-block;color:var(--mut)}
.row.brk.now .item{background:#f1f3f6;border-radius:8px;padding:6px 10px}
.row.brk.now .dot{border-color:var(--faint);background:var(--faint)}

.ev .item{background:var(--ev-soft);border-color:#efdcbf;border-left-color:var(--ev)}
.ev .item .nm{white-space:normal}
.ev .dot{border-color:var(--ev)}
.ev small.d{display:block;font-size:.76rem;color:#7d5a32;margin-top:2px}
.ev .cd{color:var(--ev);font-weight:600}
.ev .bar i{background:var(--ev)}

.tip{font-size:.78rem;color:var(--faint);text-align:center;margin:14px 16px 0}
.share{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 16px 0;padding:13px;border-radius:10px;color:#fff;font-weight:600;font-size:.95rem;text-decoration:none;background:#1f8f4e;box-shadow:0 2px 0 #176b3a;transition:transform .1s,box-shadow .1s}
.share:active{transform:translateY(2px);box-shadow:none}
.share small{font-weight:400;opacity:.9}
.foot{font-size:.7rem;color:var(--faint);text-align:center;margin-top:18px}

@keyframes spin3d{0%,88%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@media (max-width:460px){
  .turmas{gap:5px}.tc{padding:9px 6px 8px;min-height:94px}.tc .tn{font-size:1.15rem}.tc .who{font-size:.74rem}.tc .st{font-size:.54rem}.tc .cdm{font-size:.6rem}
  .grid{grid-template-columns:repeat(3,1fr)}
  .ring{width:90px;height:90px}.ring .big{font-size:1.1rem}
  .htitle{font-size:1.05rem}
  .dg{font-size:1.2rem}.seal{width:44px;height:44px}h1{font-size:.95rem}
  .row{grid-template-columns:52px 18px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="seal" title="E.E. Djalma Octaviano · 50 anos"><div class="spin" id="seal"></div></div>
      <div><h1>Aulas on-line</h1><p class="sub" id="periodo"></p></div>
    </div>
    <div class="clock" aria-label="Relógio">
      <div class="digits"><span class="dg" id="hh">00</span><span class="colon">:</span><span class="dg" id="mm">00</span><span class="dg s" id="ss">00</span></div>
      <div class="date" id="date"></div>
    </div>
  </div>

  <div class="stage" id="stage"><div class="hero" id="hero"></div></div>

  <div class="thead"><b>Turmas</b><small id="thint">toque para ver as aulas</small></div>
  <div class="turmas" id="turmas"></div>

  <div class="search">
    <div class="box glass" id="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8f8aa8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span id="pills"></span>
      <input id="q" autocomplete="off" placeholder="Digite seu nome ou turma…" aria-label="Buscar professor ou turma">
    </div>
    <div class="menu glass" id="menu" role="listbox"></div>
  </div>
  <div class="legend" id="legend"></div>

  <div class="days" id="days"></div>
  <div id="out"></div>
  <p class="tip" id="tip"></p>
  <a class="share" id="share" href="#" target="_blank" rel="noopener"></a>
  <p class="foot">E.E. Profº Djalma Octaviano · Coordenação Pedagógica</p>
</div>

<script>
/* =====================================================================
   DADOS DO CRONOGRAMA — para atualizar, mexa só neste bloco
   - TURMAS: na ordem das colunas da planilha
   - DIAS: cada linha de "a" é um horário de aula, com um nome por turma
   - eventos: reuniões/avisos do dia (i = início; f = fim, opcional)
   ===================================================================== */
const PERIODO="12 e 13/11";
const TURMAS=["2A","2B","3A","3B","3C"];
const SLOTS=[
  {i:"07:45",f:"08:35"},{i:"08:35",f:"09:25"},
  {b:"cafe",i:"09:25",f:"09:40",n:"Intervalo · café da manhã"},
  {i:"09:40",f:"10:30"},{i:"10:30",f:"11:20"},{i:"11:20",f:"12:10"},
  {b:"almoco",i:"12:10",f:"13:10",n:"Intervalo · almoço"},
  {i:"13:10",f:"14:00"},{i:"14:00",f:"14:50"}
];
const DIAS=[
 {sem:"Quinta",dt:"12/11",iso:"2026-11-12",cor:"#ef6f6c",sombra:"#b84a48",a:[
  ["Lázaro","Fábio","Will","Simone","Marcos"],
  ["Fábio","Lázaro","Magda","Will","Simone"],
  ["Marcos","Neila","Lázaro","Dani","Will"],
  ["Mari","Marcos","Dani","Lázaro","Thaís"],
  ["Alline","Mari","Marcos","Thaís","Neila"],
  ["Simone","Magda","Mari","Neila","Alline"],
  ["Magda","Simone","Neila","Alline","Fábio"]]},
 {sem:"Sexta",dt:"13/11",iso:"2026-11-13",cor:"#3b8ce8",sombra:"#2763a8",a:[
  ["Fábio","Magda","Will","Thaís","Alline"],
  ["Magda","Fábio","Simone","Will","Thaís"],
  ["Neila","Dani","Mari","Marcos","Will"],
  ["Dani","Mari","Fábio","Simone","Marcos"],
  ["Mari","Alline","Thaís","Fábio","Lázaro"],
  ["Thaís","Neila","Magda","Dani","Simone"],
  ["Neila","Thaís","Alline","Lázaro","Dani"]],
  eventos:[{i:"14:50",n:"ATPCG via Meet com Hellen",s:"Recadinhos importantes para as próximas semanas · todos os professores"}]}
];

function cdTxt(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  if(s<3600)return p2(Math.floor(s/60))+":"+p2(s%60);

}

const av=(p,sz)=>`<span class="av" style="background:hsl(${HUE[p]} 28% 40%)${sz?`;width:${sz}px;height:${sz}px`:""}">${p.slice(0,2).toUpperCase()}</span>`;

let prof=PROFS.includes(ls.get("prof"))?ls.get("prof"):null;
let turma=TURMAS.includes(ls.get("turma"))?ls.get("turma"):null;
let dia=0;{const h=isoOf(new Date()),i=DIAS.findIndex(d=>d.iso>=h);dia=i<0?DIAS.length-1:i}
let opts=[],hi=0;
const save=()=>{ls.set("prof",prof||"");ls.set("turma",turma||"")};

$("periodo").textContent=`Cronograma de ${PERIODO} · E.E. Profº Djalma Octaviano`;
/* selo provisório (aparece se o arquivo do logo não for encontrado) */
const SELO=`<svg viewBox="0 0 120 120"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e8b23a"/><stop offset="1" stop-color="#b8821a"/></linearGradient><linearGradient id="nv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a7a"/><stop offset="1" stop-color="#16204d"/></linearGradient></defs>
<circle cx="60" cy="60" r="57" fill="url(#gd)"/><circle cx="60" cy="60" r="48" fill="url(#nv)"/>
<path id="arc" d="M24 60a36 36 0 0 1 72 0" fill="none"/><text font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="800" fill="#ffe08a" letter-spacing="2"><textPath href="#arc" startOffset="50%" text-anchor="middle">DJALMA</textPath></text>
<text x="60" y="78" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="40" font-weight="800" fill="url(#gd)">50</text>
<text x="60" y="94" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="800" fill="#fff" letter-spacing="1.5">ANOS</text>
<path d="M30 100l8-6 8 6-8 6zM74 100l8-6 8 6-8 6z" fill="#ffe08a" opacity=".8"/></svg>`;
(()=>{const img=new Image();img.alt="E.E. Djalma Octaviano · 50 anos (1976–2026)";img.onload=()=>{$("seal").innerHTML="";$("seal").appendChild(img)};img.onerror=()=>{$("seal").innerHTML=SELO};$("seal").innerHTML=SELO;img.src=LOGO})();

/* ---------- turmas em destaque ---------- */
const turmaNome=t=>t.replace(/^(\d)/,"$1º");
function turmasHTML(){
  $("turmas").className="turmas"+(turma?" has-sel":"");
  $("turmas").innerHTML=TURMAS.map((t,i)=>`<button class="tc${t===turma?" on":""}" data-t="${t}" style="--c:${TC[t]}"><span class="live"></span><span class="tn">${t[0]}<sup>º</sup>${t.slice(1)}</span><span><span class="st" data-st></span><span class="who" data-who style="display:block"></span><span class="cdm" data-cd></span></span></button>`).join("");
}
$("turmas").addEventListener("click",e=>{const b=e.target.closest(".tc");if(!b)return;const t=b.dataset.t;turma=turma===t?null:t;save();pills();turmasHTML();render();tick();
  document.querySelector(".days").scrollIntoView({behavior:"smooth",block:"start"})});
function turmaStatus(t,now){
  const j=TURMAS.indexOf(t);let lista=[];
  DIAS.forEach((d,di)=>{let k=0;SLOTS.forEach(s=>{if(s.b)return;const p=d.a[k++][j];lista.push({p,s:at(d.iso,s.i),e:at(d.iso,s.f),i:s.i,di})})});
  const cur=lista.find(x=>now>=x.s&&now<x.e);
  if(cur)return{now:true,st:"agora",who:cur.p,cd:"resta "+cdTxt(cur.e-now)};
  const nx=lista.find(x=>x.s>now);
  if(!nx)return{st:"concluído",who:"—",cd:""};
  const d=DIAS[nx.di],hoje=d.iso===isoOf(new Date(now));
  return{st:(hoje?"às ":d.sem.slice(0,3)+" ")+f(nx.i),who:nx.p,cd:"em "+cdTxt(nx.s-now)};
}
function tickTurmas(now){
  document.querySelectorAll(".tc").forEach(b=>{const x=turmaStatus(b.dataset.t,now);
    b.classList.toggle("isnow",!!x.now);b.querySelector("[data-st]").textContent=x.st;b.querySelector("[data-who]").textContent=x.who;b.querySelector("[data-cd]").textContent=x.cd});
}
turmasHTML();

$("legend").innerHTML=`<span class="l">Turmas:</span>`+TURMAS.map(t=>`<span class="tb" data-t="${t}" style="background:${TC[t]}">${t}</span>`).join("");
$("legend").onclick=e=>{const t=e.target.dataset.t;if(!t)return;turma=turma===t?null:t;save();pills();render()};

/* ---------- itens de um dia (com horários reais) ---------- */
function itens(di){
  const d=DIAS[di];let k=0;
  const L=SLOTS.map(s=>{
    const base={s:at(d.iso,s.i),e:at(d.iso,s.f),i:s.i,f:s.f};
    if(s.b)return{...base,tipo:"brk",b:s.b,n:s.n};
    const a=d.a[k++];let tem=true,info;
    if(!prof&&!turma)info={all:a};
    else if(turma&&!prof)info={p:a[TURMAS.indexOf(turma)],t:turma};
    else if(prof&&!turma){const ts=TURMAS.filter((t,j)=>a[j]===prof);tem=ts.length>0;info={ts,p:prof}}
    else{tem=a[TURMAS.indexOf(turma)]===prof;info={p:prof,t:turma}}
    return{...base,tipo:"aula",tem,info};
  });
  (d.eventos||[]).forEach(ev=>{const s=at(d.iso,ev.i);L.push({tipo:"ev",s,e:ev.f?at(d.iso,ev.f):s+60*60000,i:ev.i,f:ev.f,n:ev.n,sub:ev.s})});
  return L;
}
function quem(){return prof&&turma?`${prof} no ${turma}`:prof?prof:turma?`Turma ${turma}`:"Todas as turmas"}
function descr(x){
  if(x.tipo==="ev")return x.n;
  if(x.tipo==="brk")return x.n;
  const v=x.info;
  if(v.all)return "Aulas nas "+TURMAS.length+" turmas";
  if(prof&&!turma)return v.ts.map(tb).join(" ")+" Turma "+v.ts.join(" e ");
  return tb(v.t)+" "+v.p;
}

/* ---------- busca ---------- */
function pills(){
  if($("turmas").children.length)turmasHTML();
  $("pills").innerHTML=
    (turma?`<span class="pill" style="background:${TC[turma]}">${I.users}&nbsp;${turma}<button data-x="turma" aria-label="Remover">✕</button></span> `:"")+
    (prof?`<span class="pill" style="background:var(--navy)">${av(prof)}${prof}<button data-x="prof" aria-label="Remover">✕</button></span>`:"");
  $("q").placeholder=prof&&turma?"":prof?"+ turma (opcional)":turma?"+ professor (opcional)":"Digite seu nome ou turma…";
}
function menu(){
  const q=norm($("q").value.trim());
  const hl=s=>{if(!q)return s;const i=norm(s).indexOf(q);return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length)};
  const ts=turma?[]:TURMAS.filter(t=>norm(t).includes(q));
  const ps=prof?[]:PROFS.filter(p=>norm(p).includes(q));
  opts=[...ts.map(v=>({v,k:"turma"})),...ps.map(v=>({v,k:"prof"}))];
  hi=Math.min(hi,Math.max(0,opts.length-1));
  let h="",i=0;
  if(ts.length)h+=`<div class="grp">${I.users} Turmas</div>`+ts.map(t=>`<div class="opt${i===hi?" hi":""}" data-i="${i++}">${tb(t)}<span class="grow">${hl(t)}</span><small>${DIAS[0].a.length} aulas/dia</small></div>`).join("");
  if(ps.length)h+=`<div class="grp">${I.person} Professores</div>`+ps.map(p=>`<div class="opt${i===hi?" hi":""}" data-i="${i++}">${av(p,28)}<span class="grow">${hl(p)}</span><small>${TOT[p]} aulas no período</small></div>`).join("");
  $("menu").innerHTML=h||`<div class="none">Nenhum professor ou turma com esse nome</div>`;
  $("menu").querySelector(".hi")?.scrollIntoView({block:"nearest"});
}
const abrir=()=>{menu();$("menu").classList.add("open")};
const fechar=()=>$("menu").classList.remove("open");
function escolher(o){
  if(!o)return;
  if(o.k==="prof")prof=o.v;else turma=o.v;
  save();$("q").value="";hi=0;pills();render();
  if(prof&&turma){fechar();$("q").blur()}else menu();
}
$("q").addEventListener("focus",abrir);
$("q").addEventListener("input",()=>{hi=0;abrir()});
$("q").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(hi+1,opts.length-1);menu()}
  else if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(hi-1,0);menu()}
  else if(e.key==="Enter"){e.preventDefault();escolher(opts[hi])}
  else if(e.key==="Escape"){fechar();$("q").blur()}
  else if(e.key==="Backspace"&&!$("q").value&&(prof||turma)){if(prof)prof=null;else turma=null;save();pills();menu();render()}
});
$("menu").addEventListener("mousedown",e=>{const o=e.target.closest(".opt");if(o){e.preventDefault();escolher(opts[+o.dataset.i])}});
$("box").addEventListener("click",e=>{
  const x=e.target.closest("[data-x]")?.dataset.x;
  if(x){if(x==="prof")prof=null;else turma=null;save();pills();render()}
  $("q").focus();abrir();
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))fechar()});

/* ---------- dias ---------- */
function days(){
  const hj=isoOf(new Date());
  $("days").innerHTML=DIAS.map((d,i)=>`<button class="day${i===dia?" on":""}" data-i="${i}"><span>${d.sem}</span><b>${d.dt}</b>${d.iso===hj?`<span class="hj">hoje</span>`:""}</button>`).join("");
}
$("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(b){dia=+b.dataset.i;days();render()}});

/* ---------- lista do dia ---------- */
function rowHTML(l){
  const ds=`data-s="${l.s}" data-e="${l.e}"`;
  if(l.tipo==="brk")return`<div class="row brk" ${ds}><div class="tm"><small>${f(l.i)}</small></div><div class="rail"><span class="dot"></span></div><div class="body"><div class="item">${I[l.b]}<span>${l.n} · até ${f(l.f)}</span><span class="cd"></span></div></div></div>`;
  if(l.tipo==="ev")return`<div class="row ev" data-k="1" ${ds}><div class="tm"><b>${f(l.i)}</b><small>todos</small></div><div class="rail"><span class="dot"></span></div><div class="body"><div class="item">${I.meet}<div style="flex:1;min-width:0"><div class="nm">${l.n}</div><small class="d">${l.sub||""}</small><span class="cd" style="display:inline-block;margin-top:7px"></span></div><span class="bar"><i></i></span></div></div></div>`;
  const tm=`<div class="tm"><b>${f(l.i)}</b><small>até ${f(l.f)}</small></div>`;
  if(!l.tem)return`<div class="row">${tm}<div class="rail"><span class="dot"></span></div><div class="body"><div class="item free">${I.free} Janela livre</div></div></div>`;
  const v=l.info;let it,cor="";
  if(v.all){
    it=`<div class="item"><div class="allwrap"><div class="allhead"><span class="cd"></span></div><div class="grid">${TURMAS.map((t,j)=>`<div class="cell" style="border-color:${TC[t]}"><small style="color:${TC[t]}">${t}</small>${v.all[j]}</div>`).join("")}</div></div><span class="bar"><i></i></span></div>`;
  }else if(prof&&!turma){
    cor=TC[v.ts[0]];
    it=`<div class="item" style="border-left-color:${cor}"><span class="arrow">→</span>${v.ts.map(tb).join(" ")}<span class="nm">Turma ${v.ts.join(" e ")}</span><span class="cd"></span><span class="bar"><i></i></span></div>`;
  }else{
    cor=TC[v.t];
    it=`<div class="item" style="border-left-color:${cor}">${prof?tb(v.t)+'<span class="arrow">←</span>':""}${av(v.p,26)}<span class="nm">${v.p}</span><span class="cd"></span><span class="bar"><i></i></span></div>`;
  }
  return`<div class="row" data-k="1" ${ds}>${tm}<div class="rail"><span class="dot"${cor?` style="border-color:${cor}"`:""}></span></div><div class="body">${it}</div></div>`;
}
function render(){
  const L=itens(dia),aulas=L.filter(l=>l.tipo==="aula"&&l.tem);
  let h="";
  if(prof||turma){
    if(aulas.length){
      const a0=aulas[0],a1=aulas[aulas.length-1];
      h+=`<div class="stats">
        <div class="stat glass"><span class="ic">${I.book}</span><b>${aulas.length}</b><small>aula${aulas.length>1?"s":""} no dia</small></div>
        <div class="stat glass"><span class="ic">${I.start}</span><b>${f(a0.i)}</b><small>primeira aula</small></div>
        <div class="stat glass"><span class="ic">${I.flag}</span><b>${f(a1.f)}</b><small>fim da última</small></div></div>`;
    }else h+=`<div class="stats"><div class="stat glass" style="grid-column:1/-1;flex-direction:row;align-items:center">${I.free}<small style="font-size:.85rem">${quem()} não tem aula neste dia — veja o outro dia acima</small></div></div>`;
  }
  h+=`<div class="tl glass">`+L.map(rowHTML).join("")+`</div>`;
  $("tip").textContent=prof||turma?"":"↑ Digite seu nome ou toque numa turma para ver só as suas aulas";
  const O=$("out");O.classList.add("fade");
  setTimeout(()=>{O.innerHTML=h;O.classList.remove("fade");tick()},130);
  atualizaLink();
}

/* ---------- relógio + contagens (a cada segundo) ---------- */
const DIASEM=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function tick(){
  const now=new Date(),t=now.getTime();
  $("hh").textContent=p2(now.getHours());$("mm").textContent=p2(now.getMinutes());$("ss").textContent=p2(now.getSeconds());
  $("date").textContent=`${DIASEM[now.getDay()]}, ${now.getDate()} de ${MESES[now.getMonth()]}`;

  let marcou=false;
  document.querySelectorAll("#out .row[data-s]").forEach(r=>{
    const s=+r.dataset.s,e=+r.dataset.e,cd=r.querySelector(".cd"),bar=r.querySelector(".bar i");
    r.classList.remove("past","now","next");
    let pct=0;
    if(t>=e){r.classList.add("past");pct=100;if(cd)cd.textContent=r.classList.contains("ev")?"encerrada":"concluída"}
    else if(t>=s){r.classList.add("now");pct=(t-s)/(e-s)*100;
      if(cd)cd.textContent=r.classList.contains("brk")?"volta em "+cdTxt(e-t):r.classList.contains("ev")&&!r.dataset.f?"em andamento":"faltam "+cdTxt(e-t)}
    else{if(r.dataset.k&&!marcou){r.classList.add("next");marcou=true}if(cd)cd.textContent="em "+cdTxt(s-t)}
    if(bar)bar.style.width=pct+"%";
  });
  hero(t);
  tickTurmas(t);
}

/* ---------- destaque com anel ---------- */
let heroKey="";
function hero(t){
  // todos os itens relevantes de todos os dias, em ordem
  let pool=[];
  DIAS.forEach((d,di)=>{
    const L=itens(di).map(x=>({...x,di}));
    const meus=L.filter(x=>x.tipo==="ev"||(x.tipo==="aula"&&x.tem));
    if(!meus.length)return;
    const ini=Math.min(...meus.map(x=>x.s)),fim=Math.max(...meus.map(x=>x.e));
    pool.push(...meus,...L.filter(x=>x.tipo==="brk"&&x.s>=ini&&x.e<=fim));
  });
  pool.sort((a,b)=>a.s-b.s);
  const cur=pool.find(x=>t>=x.s&&t<x.e&&x.tipo!=="brk")||pool.find(x=>t>=x.s&&t<x.e);
  const nxt=pool.find(x=>x.s>t&&x.tipo!=="brk");
  const R=52,C=2*Math.PI*R;
  let cls,kick,title,sub,big,unit,pct,after="";
  const quando=x=>{const d=DIAS[x.di];return (d.iso===isoOf(new Date(t))?"Hoje":d.sem+" "+d.dt)+" · "+f(x.i)+(x.tipo==="aula"?" → "+f(x.f):"")};
  if(cur){
    cls=cur.tipo==="aula"?"now":cur.tipo==="brk"?"brk":"ev";
    kick=cur.tipo==="aula"?"Agora · "+quem():cur.tipo==="brk"?"Intervalo":"Reunião agora";
    title=descr(cur);sub=quando(cur);
    pct=(t-cur.s)/(cur.e-cur.s);
    big=cdTxt(cur.e-t);unit=cur.tipo==="brk"?"até voltar":cur.tipo==="ev"&&!cur.f?"desde o início":"restantes";
    if(cur.tipo==="ev"&&!cur.f){big=cdTxt(t-cur.s);}
    if(nxt)after=`<span>Depois:</span> ${descr(nxt)} <span>· ${f(nxt.i)} · em</span> <b>${cdTxt(nxt.s-t)}</b>`;
  }else if(nxt){
    cls="next";kick=(nxt.tipo==="ev"?"Próxima reunião":"Próxima aula")+" · "+quem();
    title=descr(nxt);sub=quando(nxt);
    const espera=nxt.s-t;pct=1-Math.min(1,espera/(60*60000));
    big=cdTxt(espera);unit="para começar";
    const seg=pool.find(x=>x.s>nxt.s&&x.tipo!=="brk");
    if(seg)after=`<span>Em seguida:</span> ${descr(seg)} <span>· ${f(seg.i)}</span>`;
  }else{
    cls="done";kick=quem();title="Cronograma concluído";sub="Todas as aulas de "+PERIODO+" já terminaram";big="—";unit="encerrado";pct=1;
  }
  const key=cls+kick+title+sub+after.replace(/<b>.*?<\/b>/,"");
  const H=$("hero");
  if(key!==heroKey){
    heroKey=key;H.className="hero "+cls;
    H.innerHTML=`<div class="hrow"><div class="ring"><svg width="100%" height="100%" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="${R}" fill="none" stroke-width="10"/><circle class="fg" id="rfg" cx="60" cy="60" r="${R}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="in"><div class="big" id="rbig"></div><div class="unit">${unit}</div></div></div>
      <div class="htxt"><span class="kick"><i></i>${kick}</span><div class="htitle">${title}</div><div class="hsub">${sub}</div></div></div>
      ${after?`<div class="hafter" id="haft">${after}</div>`:""}`;
  }
  $("rbig").textContent=big;
  $("rfg").style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,pct)));
  const ha=$("haft");if(ha&&after)ha.innerHTML=after;
}


/* ---------- link direto (#mari, #3a, #mari-3a) e WhatsApp ---------- */
function lerHash(){
  const h=norm(decodeURIComponent(location.hash.slice(1)));
  if(!h)return false;
  let p=null,t=null;
  h.split("-").forEach(x=>{const tt=TURMAS.find(v=>slug(v)===x);if(tt)t=tt;const pp=PROFS.find(v=>slug(v)===x);if(pp)p=pp});
  if(!p&&!t)return false;
  prof=p;turma=t;save();return true;
}
function linkBase(){
  if(!/^https?:/.test(location.protocol)||/claude|anthropic/.test(location.hostname))return SITE;
  return location.origin+location.pathname;
}
function atualizaLink(){
  const tag=[prof&&slug(prof),turma&&slug(turma)].filter(Boolean).join("-");
  try{location.replace("#"+tag)}catch(e){}
  const url=linkBase()+(tag?"#"+tag:"");
  const q=prof&&turma?`${prof} no ${turma}`:prof?prof:turma?`turma ${turma}`:"";
  const txt=(q?`Aulas on-line de *${q}* (${PERIODO}):\n`:`Cronograma de aulas on-line (${PERIODO}) — escolha seu nome ou turma:\n`)+url;
  $("share").href="https://wa.me/?text="+encodeURIComponent(txt);
  $("share").innerHTML=`${I.wa}<span>Enviar no WhatsApp<br><small>${q?`link direto para ${q}`:"cronograma completo"}</small></span>`;
}
window.addEventListener("hashchange",()=>{if(lerHash()){pills();render()}});

lerHash();pills();days();render();
setInterval(tick,1000);
</script>
