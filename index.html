<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aulas on-line · Fluxo Djalma</title>
<meta name="description" content="Qual é a minha aula agora? Consulte por professor ou turma · 09 a 11/11 · E.E. Profº Djalma Octaviano">
<meta name="theme-color" content="#6b4fbb">
<!-- Prévia no WhatsApp: troque o endereço abaixo se o seu site tiver outro nome -->
<meta property="og:type" content="website">
<meta property="og:title" content="Aulas on-line · Qual é a minha aula?">
<meta property="og:description" content="Toque para ver suas aulas de 09 a 11/11 por professor ou turma (1A, 1B, 3A, 3B, 3C).">
<meta property="og:image" content="https://aulas-djalma.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://aulas-on-line.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#f6f5fb;--card:#ffffff;--ink:#16151c;--mut:#7c7a8b;--line:#ebe9f3;--soft:#f3f1fa;
    --acc:#6b4fbb;--acc2:#9b7ff0;--accs:#efeafc;
    --now:#12936a;--nows:#e1f6ee;--next:#d48a0f;--nexts:#fff4dd;
    --meet:#a46a12;--meets:#fff7e6;--meetl:#f3dfb4;
    --t1A:#3b7ddd;--t1B:#14a39a;--t3A:#ef7d2d;--t3B:#d6457f;--t3C:#9b4fc4;
    --d0:#8a76d6;--d1:#3f8fd9;--d2:#d9779f;
    --sh:0 10px 30px rgba(30,20,70,.07);--glass:rgba(255,255,255,.72);
  }
  [data-theme="dark"]{
    --bg:#0f0e15;--card:#18171f;--ink:#f1f0f6;--mut:#9997a8;--line:#2a2835;--soft:#211f2b;
    --accs:#2a2342;--nows:#0f2c23;--nexts:#33260d;--meets:#2a2010;--meetl:#4a3816;--meet:#e3b261;
    --sh:0 10px 30px rgba(0,0,0,.35);--glass:rgba(24,23,31,.72);
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s,color .3s}
  body::before{content:"";position:fixed;inset:-20% -10% auto;height:520px;z-index:-1;pointer-events:none;
    background:radial-gradient(40% 50% at 15% 30%,rgba(155,127,240,.22),transparent 70%),radial-gradient(35% 45% at 85% 10%,rgba(59,125,221,.16),transparent 70%),radial-gradient(30% 40% at 60% 60%,rgba(214,69,127,.10),transparent 70%)}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 70px}
  svg{flex:none}
  button{font:inherit;color:inherit}

  /* barra superior fixa */
  .bar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
  .bar.sc{border-bottom-color:var(--line)}
  .top{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 6px 16px rgba(107,79,187,.35)}
  .ttl{flex:1;min-width:0}
  h1{font-size:1.3rem;font-weight:750;letter-spacing:-.02em}
  .sub{font-size:.78rem;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;padding:7px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .clock i{width:7px;height:7px;border-radius:50%;background:var(--now);box-shadow:0 0 0 0 rgba(18,147,106,.5);animation:blink 2s infinite}
  .ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
  .ib:active{transform:scale(.92)}

  /* turmas rápidas */
  .chips{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:48px;font-weight:750;font-size:.82rem;padding:8px 12px;border-radius:12px;background:var(--card);color:var(--c);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent);transition:all .2s}
  .chip.on{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-1px)}
  .chips .lbl{font-size:.72rem;color:var(--mut);align-self:center;margin-right:2px;white-space:nowrap}

  /* busca */
  .search{position:relative;margin:12px 0 14px}
  .box{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:56px;padding:8px 12px 8px 46px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh);cursor:text;transition:border-color .2s,box-shadow .2s}
  .box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--accs)}
  .box>svg{position:absolute;left:15px;top:18px}
  .pill{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:.9rem;font-weight:650;padding:5px 7px 5px 6px;border-radius:10px;animation:pop .2s ease-out}
  .pill .av{width:22px;height:22px;font-size:.66rem;border:1.5px solid rgba(255,255,255,.6)}
  .pill button{border:0;background:rgba(255,255,255,.25);color:#fff;width:18px;height:18px;border-radius:50%;font-size:.7rem;line-height:18px;padding:0;cursor:pointer}
  .box input{flex:1;min-width:130px;border:0;outline:0;font:inherit;font-size:1rem;background:none;padding:6px 2px;color:var(--ink)}
  .box input::placeholder{color:var(--mut);opacity:.7}
  .menu{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(20,20,40,.18);padding:6px;max-height:340px;overflow:auto;z-index:30;opacity:0;transform:translateY(-6px) scale(.99);pointer-events:none;transition:opacity .15s,transform .15s}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .grp{display:flex;align-items:center;gap:6px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px 4px}
  .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.95rem}
  .opt .grow{flex:1}
  .opt small{color:var(--mut);font-size:.75rem}
  .opt.hi{background:var(--accs)}
  .opt mark{background:none;color:var(--acc);font-weight:750}
  .none{padding:12px 10px;color:var(--mut);font-size:.9rem}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:750;font-size:.76rem;flex:none}
  .tb{display:inline-flex;align-items:center;justify-content:center;min-width:34px;font-weight:750;font-size:.76rem;color:#fff;padding:4px 8px;border-radius:8px}

  /* dias (segmentado com indicador deslizante) */
  .days{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:5px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
  .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:14px;transition:transform .35s cubic-bezier(.3,1.3,.5,1),background .3s;z-index:0}
  .day{position:relative;z-index:1;border:0;background:none;cursor:pointer;border-radius:14px;padding:9px 4px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .25s}
  .day b{font-size:1.1rem;color:var(--ink);transition:color .25s}
  .day span{font-size:.74rem}
  .day .hj{font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;padding:1px 7px;border-radius:999px;background:var(--soft)}
  .day.on,.day.on b{color:#fff}
  .day.on .hj{background:rgba(255,255,255,.25)}
  .day .cnt{position:absolute;top:6px;right:8px;font-size:.62rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--accs);color:var(--acc)}
  .day.on .cnt{background:rgba(255,255,255,.28);color:#fff}

  /* modo de exibição */
  .tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{border:0;background:none;cursor:pointer;font-size:.8rem;font-weight:650;color:var(--mut);padding:6px 11px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
  .seg button.on{background:var(--accs);color:var(--acc)}
  .hint{font-size:.72rem;color:var(--mut)}

  #out{transition:opacity .16s,transform .16s}
  #out.fade{opacity:0;transform:translateY(6px)}
  #out.sl{opacity:0;transform:translateX(var(--sx,0))}

  /* destaque */
  .hero{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;border-radius:18px;padding:15px 16px;margin-bottom:12px;border:1.5px solid}
  .hero .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
  .hero .k{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .hero .v{font-size:1.06rem;font-weight:650;margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hero .s{font-size:.8rem;color:var(--mut);margin-top:3px}
  .hero .grow{flex:1;min-width:0}
  .hero.now{background:var(--nows);border-color:color-mix(in srgb,var(--now) 30%,transparent)}.hero.now .ic{background:var(--now)}.hero.now .k{color:var(--now)}
  .hero.next{background:var(--nexts);border-color:color-mix(in srgb,var(--next) 35%,transparent)}.hero.next .ic{background:var(--next)}.hero.next .k{color:var(--next)}
  .hero.info{background:var(--card);border-color:var(--line)}.hero.info .ic{background:var(--accs)}.hero.info .k{color:var(--acc)}
  .hero.done{background:var(--card);border-color:var(--line)}.hero.done .ic{background:var(--soft)}.hero.done .k{color:var(--mut)}
  .cd{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;text-align:right;line-height:1}
  .cd small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--now);border-radius:0 4px 4px 0;transition:width 1s linear}
  .hero.next .prog{background:var(--next)}
  .live{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
  .live div{background:var(--card);border-radius:10px;padding:6px 7px;font-size:.8rem;font-weight:650;border-top:3px solid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live small{display:block;font-size:.6rem;font-weight:800}

  /* NA SALA (destaque) */
  .sala{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:rise .35s both}
  .sala.aov{border-color:color-mix(in srgb,var(--now) 45%,transparent);box-shadow:0 0 0 4px var(--nows),var(--sh)}
  .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sh h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em}
  .sh .tm2{font-size:.8rem;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
  .sh .x{margin-left:auto;border:1px solid var(--line);background:var(--soft);border-radius:999px;font-size:.72rem;font-weight:700;padding:4px 10px;cursor:pointer;color:var(--mut)}
  .onair{display:inline-flex;align-items:center;gap:6px;background:#e5484d;color:#fff;font-size:.66rem;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:7px}
  .onair i{width:7px;height:7px;border-radius:50%;background:#fff;animation:onair 1.2s infinite}
  .when{display:inline-flex;align-items:center;gap:6px;background:var(--accs);color:var(--acc);font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
  .rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .rooms.one{grid-template-columns:1fr}
  .room{position:relative;border-radius:16px;padding:10px 10px 11px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:opacity .25s,transform .25s}
  .room .rt{align-self:stretch;display:flex;align-items:center;justify-content:space-between}
  .room .rt .tb{font-size:.72rem;padding:3px 7px;background:var(--c)}
  .room .lv{width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:onair2 1.6s infinite}
  .room .big{width:50px;height:50px;font-size:1rem;box-shadow:0 0 0 3px var(--card)}
  .room b{font-size:1.02rem;font-weight:800;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room small{font-size:.68rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room.dim{opacity:.32;transform:scale(.97)}
  .room.me{box-shadow:0 8px 22px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-2px)}
  .rooms.one .room{flex-direction:row;text-align:left;padding:14px 16px;gap:14px}
  .rooms.one .room .rt{display:none}
  .rooms.one .room .big{width:64px;height:64px;font-size:1.2rem}
  .rooms.one .room .inf{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .rooms.one .room b{font-size:1.4rem}
  .rooms.one .room small{font-size:.8rem}
  .rooms.one .room .tag1{display:flex;align-items:center;gap:7px}
  .room .inf{display:contents}
  .room .tag1{display:none}
  .sala .nt{font-size:.74rem;color:var(--mut);margin-top:10px;text-align:center}
  .row.sel .item,.row.sel .gridT{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:13px}
  .row:not(.brk){cursor:pointer}
  .tbl tbody tr:not(.bk){cursor:pointer}
  .tbl tr.sl td.h{color:var(--acc)}
  .tbl tr.sl td:not(.h){outline:2px solid var(--acc);outline-offset:-2px}

  /* reuniões */
  .obs{position:relative;display:flex;gap:12px;align-items:center;background:var(--meets);border:1.5px solid var(--meetl);border-radius:16px;padding:11px 14px;margin-bottom:12px;animation:rise .4s both}
  .obs .ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--meet) 18%,transparent);display:grid;place-items:center;flex:none}
  .obs b{display:block;font-size:.92rem}
  .obs small{font-size:.76rem;color:var(--meet);font-weight:600}
  .obs.me{border-color:var(--next);box-shadow:0 0 0 3px color-mix(in srgb,var(--next) 25%,transparent)}

  /* resumo da semana */
  .week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .wk{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;transition:transform .15s,border-color .2s}
  .wk:active{transform:scale(.97)}
  .wk.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
  .wk small{font-size:.68rem;color:var(--mut);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
  .wk b{display:block;font-size:1.25rem;margin-top:2px}
  .wk .bars{display:flex;gap:3px;margin-top:6px}
  .wk .bars i{flex:1;height:5px;border-radius:3px;background:var(--soft)}

  /* linha do tempo */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px 8px 10px;box-shadow:var(--sh)}
  .row{display:grid;grid-template-columns:60px 22px minmax(0,1fr);align-items:center;min-height:62px}
  .anim .row{animation:rise .38s both;animation-delay:calc(var(--k)*35ms)}
  .tm{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15;padding-right:2px}
  .tm b{display:block;font-size:.92rem}
  .tm small{font-size:.7rem;color:var(--mut)}
  .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
  .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
  .row:first-child .rail::before{top:50%}.row:last-child .rail::before{bottom:50%}
  .rail .fill{position:absolute;top:0;width:2px;background:var(--now);transition:height 1s linear}
  .dot{position:relative;align-self:center;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);z-index:1;transition:all .3s}
  .body{padding:6px 0 6px 8px;min-width:0}
  .item{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--soft);border-left:4px solid var(--line)}
  .item .arrow{color:var(--mut);font-weight:700}
  .item .nm{font-weight:650;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .tag{margin-left:auto;font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .item .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--now);transition:width 1s linear}
  .item.free{background:none;border:1.5px dashed var(--line);color:var(--mut);font-size:.88rem}
  .row.past{opacity:.4}
  .row.now .dot{border-color:var(--now);background:var(--now);box-shadow:0 0 0 5px var(--nows);animation:pulse 1.6s infinite}
  .row.now .item:not(.free){box-shadow:0 0 0 2px var(--now) inset}
  .row.now .tag{background:var(--now);color:#fff}
  .row.next .dot{border-color:var(--next)}
  .row.next .tag{background:var(--nexts);color:var(--next)}
  .brk .item{background:none;border:0;padding:6px 4px;color:var(--mut);font-size:.8rem;gap:8px}
  .brk .dot{width:8px;height:8px;border-width:2px}
  .gridT{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
  .cell{border-radius:10px;padding:6px 7px;font-size:.82rem;font-weight:650;background:var(--soft);border-top:3px solid;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell small{display:block;font-size:.62rem;font-weight:800;margin-bottom:2px}
  .rmk{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:.66rem;font-weight:750;color:var(--meet);background:var(--meets);border:1px solid var(--meetl);border-radius:999px;padding:2px 9px}

  /* grade (tabela) */
  .tbl{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
  .tbl th{font-size:.72rem;padding:4px 0}
  .tbl th:first-child{width:52px}
  .tbl td{font-size:.8rem;font-weight:650;text-align:center;padding:9px 3px;border-radius:10px;background:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .2s}
  .tbl td.h{background:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700;font-size:.74rem;padding-right:6px}
  .tbl tr.bk td{background:none;color:var(--mut);font-weight:500;font-size:.72rem;padding:3px}
  .tbl tr.nw td:not(.h):not([colspan]){box-shadow:0 0 0 2px var(--now) inset}
  .tbl tr.nw td.h{color:var(--now)}
  .tbl tr.ps td{opacity:.45}
  .tbl td.me{color:#fff}
  .tbl.flt td:not(.h):not(.me):not([colspan]){opacity:.28}
  .tbl td.mt{box-shadow:inset 0 -3px 0 var(--meetl)}

  .tip{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
  .acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
  .share{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:15px;background:#25d366;color:#fff;font-weight:750;font-size:.98rem;text-decoration:none;box-shadow:0 8px 20px rgba(37,211,102,.3);transition:transform .15s}
  .share:active,.copy:active{transform:scale(.97)}
  .share small{font-weight:400;opacity:.9}
  .copy{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:0 16px;cursor:pointer;font-weight:650;font-size:.85rem;display:flex;align-items:center;gap:7px;transition:transform .15s}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#16151c;color:#fff;font-size:.85rem;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .foot{text-align:center;font-size:.7rem;color:var(--mut);margin-top:18px;opacity:.8}

  /* ===== EFEITOS 3D ===== */
  .orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;perspective:900px}
  .orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;will-change:transform;
    transform:translate3d(calc(var(--px,0)*var(--d)),calc(var(--py,0)*var(--d) + var(--sy,0)*var(--d)*-.4),0);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .orb>i{display:block;width:100%;height:100%;border-radius:50%;animation:float var(--t) ease-in-out infinite alternate}
  .o1{width:340px;height:340px;left:-80px;top:40px;--d:26px;--t:9s}.o1>i{background:radial-gradient(circle at 35% 35%,#b9a2ff,#6b4fbb)}
  .o2{width:280px;height:280px;right:-70px;top:180px;--d:-34px;--t:11s}.o2>i{background:radial-gradient(circle at 35% 35%,#8fc3ff,#3b7ddd)}
  .o3{width:240px;height:240px;left:30%;top:620px;--d:20px;--t:13s}.o3>i{background:radial-gradient(circle at 35% 35%,#ffb3cf,#d6457f)}
  .o4{width:200px;height:200px;right:12%;top:980px;--d:-22px;--t:10s}.o4>i{background:radial-gradient(circle at 35% 35%,#ffd59a,#ef7d2d)}
  [data-theme="dark"] .orb{opacity:.32}
  @keyframes float{to{transform:translate3d(30px,-40px,0) scale(1.12)}}

  [data-tilt]{--rx:0deg;--ry:0deg;--ty:0px;--sc:1;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty)) scale(var(--sc));transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .25s}
  [data-tilt].tilting{transform-style:preserve-3d}
  [data-tilt].tilting{transition:transform .08s linear,box-shadow .3s}
  [data-tilt]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);opacity:var(--go,0);transition:opacity .35s;mix-blend-mode:overlay}
  [data-tilt].tilting{box-shadow:0 22px 40px rgba(30,20,70,.16)}
  .ring{display:grid;place-items:center;border-radius:50%;padding:4px;background:var(--c);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .tilting .ring{transform:translateZ(34px)}
  .aov .ring{background:conic-gradient(from var(--a,0deg),#e5484d,color-mix(in srgb,var(--c) 30%,transparent) 30%,var(--c) 55%,color-mix(in srgb,#e5484d 20%,transparent) 80%,#e5484d);animation:spin 2.4s linear infinite}
  .room b,.room small,.room .rt,.hero .ic,.hero .cd,.wk b{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .tilting.room b{transform:translateZ(22px)}
  .tilting.room small,.tilting.room .rt{transform:translateZ(12px)}
  .room.me{--ty:-3px}.room.dim{--sc:.96}
  .tilting.hero .ic,.tilting.hero .cd{transform:translateZ(26px)}
  .wk b{display:block}.tilting.wk b{transform:translateZ(18px)}
  @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}

  /* botões com profundidade */
  .chip{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent),0 3px 0 color-mix(in srgb,var(--c) 22%,transparent)}
  .chip:active{transform:translateY(2px)}
  .chip.on{box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000),0 10px 20px color-mix(in srgb,var(--c) 40%,transparent)}
  .share{box-shadow:0 5px 0 #1a9e4c,0 12px 24px rgba(37,211,102,.32)}
  .share:active{transform:translateY(4px);box-shadow:0 1px 0 #1a9e4c,0 6px 12px rgba(37,211,102,.3)}
  .copy{box-shadow:0 4px 0 var(--line)}.copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .ind{box-shadow:0 8px 18px rgba(30,20,70,.22),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12)}
  .logo{transform-style:preserve-3d;animation:logo3d 6s ease-in-out infinite}
  @keyframes logo3d{0%,100%{transform:perspective(300px) rotateY(-14deg) rotateX(6deg)}50%{transform:perspective(300px) rotateY(14deg) rotateX(-6deg)}}

  /* relógio e contagem com dígitos girando */
  .flip{display:inline-block;transform-origin:50% 60%}
  .flip.go{animation:flipd .45s cubic-bezier(.2,.9,.25,1.2)}
  @keyframes flipd{from{transform:perspective(200px) rotateX(-90deg);opacity:0}}

  /* troca de dia em 3D */
  #out{transform-origin:50% 0;perspective:1400px}
  #out.sl{opacity:0;transform:perspective(1400px) translateX(var(--sx,0)) rotateY(var(--sr,0deg)) scale(.97);transition:opacity .16s,transform .2s ease-in}
  #out.enter{animation:flipIn .55s cubic-bezier(.2,.85,.25,1)}
  @keyframes flipIn{from{opacity:0;transform:perspective(1400px) translateX(var(--ex,0)) rotateY(var(--er,0deg)) scale(.97)}}
  .anim .row{animation:row3d .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--k)*38ms)}
  @keyframes row3d{from{opacity:0;transform:perspective(700px) rotateX(-28deg) translateY(14px);transform-origin:50% 0}}
  .sala,.hero,.obs,.week{animation:card3d .6s cubic-bezier(.2,.85,.25,1) both}
  @keyframes card3d{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(16px) scale(.98)}}
  #out:not(.anim) .sala,#out:not(.anim) .hero,#out:not(.anim) .obs,#out:not(.anim) .week{animation:none}

  @keyframes onair{50%{opacity:.25}}
  @keyframes onair2{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}}
  @keyframes pulse{50%{box-shadow:0 0 0 9px rgba(18,147,106,.08)}}
  @keyframes blink{0%{box-shadow:0 0 0 0 rgba(18,147,106,.55)}70%{box-shadow:0 0 0 7px rgba(18,147,106,0)}100%{box-shadow:0 0 0 0 rgba(18,147,106,0)}}
  @media (max-width:500px){
    .gridT,.live,.rooms{grid-template-columns:repeat(3,1fr)}
    .rooms.one{grid-template-columns:1fr}
    .clock{font-size:.85rem;padding:6px 9px}
    .tbl td{font-size:.72rem;padding:8px 1px}
    .hint{display:none}
    .row.now .item .nm,.row.next .item .nm{display:none}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="orbs" aria-hidden="true"><span class="orb o1"><i></i></span><span class="orb o2"><i></i></span><span class="orb o3"><i></i></span><span class="orb o4"><i></i></span></div>
<div class="wrap">

  <div class="search">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <button data-m="tl"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/><path d="M10 6h10M10 12h10M10 18h10"/></svg>Linha do tempo</button>
      <button data-m="gd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Grade</button>
    </div>

  </div>
  <p class="foot">Fluxo Djalma · E.E. Profº Djalma Octaviano</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== CRONOGRAMA 09 a 11/11 ===== */
const PERIODO="09 a 11/11";
const TURMAS=["1A","1B","3A","3B","3C"];
const TC={"1A":"var(--t1A)","1B":"var(--t1B)","3A":"var(--t3A)","3B":"var(--t3B)","3C":"var(--t3C)"};
const SLOTS=[
  {i:"07:45",f:"08:35"},{i:"08:35",f:"09:25"},
  {b:"cafe",i:"09:25",f:"09:40",n:"Intervalo · café da manhã"},
  {i:"09:40",f:"10:30"},{i:"10:30",f:"11:20"},{i:"11:20",f:"12:10"},
  {b:"almoco",i:"12:10",f:"13:10",n:"Intervalo · almoço"},
  {i:"13:10",f:"14:00"},{i:"14:00",f:"14:50"}
];
/* cada linha = um horário de aula; colunas na ordem de TURMAS (1A, 1B, 3A, 3B, 3C) */
const DIAS=[
 {sem:"Segunda",dt:"09/11",iso:"2026-11-09",
  obs:[{i:"09:40",f:"12:10",txt:"Reunião de equipe de Ciências da Natureza e Matemática"}],
  a:[["Mari","Magda","Simone","Will","Dani"],
     ["Magda","Mari","Dani","Simone","Will"],
     ["Geni","Dani","Thaís","Neila","Marcos"],
     ["Dani","Lázaro","Geni","Marcos","Thaís"],
     ["Lázaro","Geni","Marcos","Thaís","Neila"],
     ["Thaís","Alline","Lázaro","Fábio","Geni"],
     ["Alline","Thaís","Neila","Lázaro","Fábio"]]},
 {sem:"Terça",dt:"10/11",iso:"2026-11-10",
  obs:[],
  a:[["Magda","Simone","Alline","Geni","Will"],
     ["Simone","Magda","Will","Alline","Geni"],
     ["Alline","Marcos","Magda","Will","Simone"],
     ["Marcos","Alline","Mari","Fábio","Thaís"],
     ["Mari","Lázaro","Fábio","Thaís","Alline"],
     ["Lázaro","Mari","Dani","Neila","Fábio"],
     ["Fábio","Will","Neila","Dani","Lázaro"]]},
 {sem:"Quarta",dt:"11/11",iso:"2026-11-11",
  obs:[{i:"13:10",f:"14:50",txt:"Reunião: Alline, Will e Hellen",quem:["Alline","Will"]}],
  a:[["Magda","Alline","Dani","Neila","Geni"],
     ["Alline","Magda","Geni","Dani","Neila"],
     ["Simone","Marcos","Fábio","Magda","Dani"],
     ["Marcos","Simone","Will","Geni","Magda"],
     ["Will","Fábio","Mari","Marcos","Lázaro"],
     ["Neila","Mari","Thaís","Simone","Marcos"],
     ["Mari","Neila","Simone","Lázaro","Thaís"]]}
];
const NAULAS=SLOTS.filter(s=>!s.b).length;
const INI=SLOTS.find(s=>!s.b).i, FIM=SLOTS[SLOTS.length-1].f;
const PROFS=[...new Set(DIAS.flatMap(d=>d.a.flat()))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
const TOT={};DIAS.forEach(d=>d.a.flat().forEach(p=>TOT[p]=(TOT[p]||0)+1));
const HUE={};PROFS.forEach((p,i)=>HUE[p]=Math.round(i*360/PROFS.length+250)%360);
const DCOR=["var(--d0)","var(--d1)","var(--d2)"];

/* ícones */
const I={
  clock:c=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  play:c=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="${c}"><circle cx="12" cy="12" r="10" fill="none" stroke="${c}" stroke-width="2"/><path d="m10 8 6 4-6 4z"/></svg>`,
  check:c=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>`,
  cal:c=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  meet:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.7-5 6-5s6 2 6 5M14 15.3c.6-.2 1.3-.3 2-.3 3.3 0 6 2 6 5"/></svg>`,
  cafe:`<svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M6 13h16v6a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z" fill="#f4e3d3" stroke="#a46a3f" stroke-width="1.8"/><path d="M22 15h2a3 3 0 0 1 0 6h-2.4" stroke="#a46a3f" stroke-width="1.8"/><path d="M11 4c-1 1.5 1 2.5 0 4M15 3c-1 1.5 1 2.5 0 4.5M19 4c-1 1.5 1 2.5 0 4" stroke="#c9a283" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  almoco:`<svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="17" r="10" fill="#fff4dd" stroke="#d48a0f" stroke-width="1.8"/><circle cx="16" cy="17" r="5.5" fill="#ffe6b0"/><path d="M3.5 6v7m-1.5-7v4a1.5 1.5 0 0 0 3 0V6M29 6c-2 0-2.5 3-2.5 6h2.5v8" stroke="#8f8d9c" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  free:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M8 12h8"/></svg>`,
  users:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-5-5.7"/></svg>`,
  person:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>`,
  sun:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  moon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`
};

const ls={get:k=>{try{return localStorage.getItem("fdA3_"+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem("fdA3_"+k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const mn=s=>{const[h,m]=s.split(":");return h*60+ +m};
const f=s=>s.replace(":","h").replace(/^0/,"");
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const isoHoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const agoraSeg=()=>{const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()};
const agoraMin=()=>Math.floor(agoraSeg()/60);
const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`;
const mmss=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const tb=t=>`<span class="tb" style="background:${TC[t]}">${t}</span>`;
const pc=p=>`hsl(${HUE[p]} 55% 50%)`;
const av=(p,sz)=>`<span class="av" style="background:${pc(p)}${sz?`;width:${sz}px;height:${sz}px`:""}">${p.slice(0,2).toUpperCase()}</span>`;

let prof=PROFS.includes(ls.get("prof"))?ls.get("prof"):null;
let turma=TURMAS.includes(ls.get("turma"))?ls.get("turma"):null;
let modo=ls.get("modo")==="gd"?"gd":"tl";
let dia=Math.max(0,DIAS.findIndex(d=>d.iso===isoHoje()));
let opts=[],hi=0,slotSel=null;
const save=()=>{ls.set("prof",prof||"");ls.set("turma",turma||"")};

/* ---------- tema ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").innerHTML=t==="dark"?I.sun:I.moon;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0f0e15":"#6b4fbb"}
setTheme(ls.get("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";ls.set("tema",t);setTheme(t)};

$("sub").textContent=`Cronograma de ${PERIODO} · E.E. Profº Djalma Octaviano`;
addEventListener("scroll",()=>$("bar").classList.toggle("sc",scrollY>8),{passive:true});

/* ---------- turmas rápidas ---------- */
function chips(){
  $("chips").innerHTML=`<span class="lbl">Turmas</span>`+TURMAS.map(t=>`<button class="chip${t===turma?" on":""}" style="--c:${TC[t]}" data-t="${t}">${t}</button>`).join("");
}
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;turma=turma===b.dataset.t?null:b.dataset.t;save();pills();render(true)});

/* ---------- busca ---------- */
function pills(){
  $("pills").innerHTML=
    (turma?`<span class="pill" style="background:${TC[turma]}">${I.users}&nbsp;${turma}<button data-x="turma" aria-label="Remover">✕</button></span> `:"")+
    (prof?`<span class="pill" style="background:${pc(prof)}">${av(prof)}${prof}<button data-x="prof" aria-label="Remover">✕</button></span>`:"");
  $("q").placeholder=prof&&turma?"":prof?"+ turma (opcional)":turma?"+ professor (opcional)":"Digite um professor ou turma…";
  chips();
}
function menu(){
  const q=norm($("q").value.trim());
  const hl=s=>{if(!q)return s;const i=norm(s).indexOf(q);return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length)};
  const ts=turma?[]:TURMAS.filter(t=>norm(t).includes(q));
  const ps=prof?[]:PROFS.filter(p=>norm(p).includes(q));
  opts=[...ts.map(v=>({v,k:"turma"})),...ps.map(v=>({v,k:"prof"}))];
  hi=Math.min(hi,Math.max(0,opts.length-1));
  let h="",i=0;
  if(ts.length)h+=`<div class="grp">${I.users} Turmas</div>`+ts.map(t=>`<div class="opt${i===hi?" hi":""}" data-i="${i++}">${tb(t)}<span class="grow">${hl(t)}</span><small>${NAULAS} aulas/dia</small></div>`).join("");
  if(ps.length)h+=`<div class="grp">${I.person} Professores</div>`+ps.map(p=>`<div class="opt${i===hi?" hi":""}" data-i="${i++}">${av(p,28)}<span class="grow">${hl(p)}</span><small>${TOT[p]} aulas na semana</small></div>`).join("");
  $("menu").innerHTML=h||`<div class="none">Nenhum professor ou turma com esse nome</div>`;
  $("menu").querySelector(".hi")?.scrollIntoView({block:"nearest"});
}
const abrir=()=>{menu();$("menu").classList.add("open")};
const fechar=()=>$("menu").classList.remove("open");
function escolher(o){
  if(!o)return;
  if(o.k==="prof")prof=o.v;else turma=o.v;
  save();$("q").value="";hi=0;pills();render(true);
  if(prof&&turma){fechar();$("q").blur()}else menu();
}
$("q").addEventListener("focus",abrir);
$("q").addEventListener("input",()=>{hi=0;abrir()});
$("q").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();hi=Math.min(hi+1,opts.length-1);menu()}
  else if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(hi-1,0);menu()}
  else if(e.key==="Enter"){e.preventDefault();escolher(opts[hi])}
  else if(e.key==="Escape"){fechar();$("q").blur()}
  else if(e.key==="Backspace"&&!$("q").value&&(prof||turma)){if(prof)prof=null;else turma=null;save();pills();menu();render(true)}
});
$("menu").addEventListener("mousedown",e=>{const o=e.target.closest(".opt");if(o){e.preventDefault();escolher(opts[+o.dataset.i])}});
$("box").addEventListener("click",e=>{
  const x=e.target.closest("[data-x]")?.dataset.x;
  if(x){if(x==="prof")prof=null;else turma=null;save();pills();render(true)}
  $("q").focus();abrir();
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))fechar()});

/* ---------- dias ---------- */
function contaDia(i){const d=DIAS[i];return d.a.reduce((n,a)=>n+(prof&&turma?(a[TURMAS.indexOf(turma)]===prof?1:0):prof?a.filter(x=>x===prof).length:turma?1:0),0)}
function days(){
  const hj=isoHoje();
  $("days").innerHTML=`<span class="ind" style="transform:translateX(${dia*100}%);background:${DCOR[dia]}"></span>`+DIAS.map((d,i)=>{
    const c=prof?contaDia(i):null;
    return`<button class="day${i===dia?" on":""}" data-i="${i}"><span>${d.sem}</span><b>${d.dt}</b>${d.iso===hj?`<span class="hj">hoje</span>`:""}${c!==null?`<span class="cnt">${c}</span>`:""}</button>`}).join("");
}
function irDia(n,dir){
  if(n<0||n>=DIAS.length||n===dia)return;
  const O=$("out"),sg=dir||(n>dia?1:-1);
  O.style.setProperty("--sx",sg*-50+"px");O.style.setProperty("--sr",sg*16+"deg");
  O.style.setProperty("--ex",sg*50+"px");O.style.setProperty("--er",sg*-16+"deg");
  O.classList.add("sl");
  dia=n;slotSel=null;days();setTimeout(()=>{render(true,true)},140);
}
$("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(b)irDia(+b.dataset.i)});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")irDia(dia+1);if(e.key==="ArrowLeft")irDia(dia-1)});
let tx=null,ty=null;
$("out").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("out").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)irDia(dia+(dx<0?1:-1));tx=null},{passive:true});

/* ---------- modo ---------- */
function modoUI(){$("modo").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===modo))}
$("modo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.m===modo)return;modo=b.dataset.m;ls.set("modo",modo);modoUI();render(true)});

/* ---------- dados do dia ---------- */
function linhas(){
  const d=DIAS[dia];let k=0;
  return SLOTS.map(s=>{
    if(s.b)return{...s};
    const a=d.a[k++];let tem=true,info;
    if(!prof&&!turma)info={all:a};
    else if(turma&&!prof)info={p:a[TURMAS.indexOf(turma)],t:turma};
    else if(prof&&!turma){const ts=TURMAS.filter((t,j)=>a[j]===prof);tem=ts.length>0;info={ts,p:prof}}
    else{tem=a[TURMAS.indexOf(turma)]===prof;info={p:prof,t:turma}}
    const ob=(d.obs||[]).find(o=>mn(s.i)>=mn(o.i)&&mn(s.f)<=mn(o.f));
    return{...s,a,tem,info,ob,k:k-1};
  });
}

/* ---------- render ---------- */
function itemHTML(l){
  const x=l.info;
  if(!l.tem)return`<div class="item free">${I.free} Janela livre</div>`;
  if(x.all)return`<div class="gridT">${TURMAS.map((t,j)=>`<div class="cell" style="border-color:${TC[t]}"><small style="color:${TC[t]}">${t}</small>${x.all[j]}</div>`).join("")}</div>`;
  if(prof&&!turma){
    const c=TC[x.ts[0]];
    return`<div class="item" style="border-left-color:${c}">${av(prof,26)}<span class="arrow">→</span>${x.ts.map(tb).join(" ")}<span class="nm">Turma ${x.ts.join(" e ")}</span>TAG</div>`;
  }
  return`<div class="item" style="border-left-color:${TC[x.t]}">${tb(x.t)}<span class="arrow">←</span>${av(x.p,26)}<span class="nm">${x.p}</span>TAG</div>`;
}
function alvoTxt(l){
  const x=l.info;
  if(x.all)return`<span>Todas as turmas em aula</span>`;
  if(prof&&!turma)return`${x.ts.map(tb).join(" ")} <span>Turma ${x.ts.join(" e ")}</span>`;
  return`${tb(x.t)} <span>→ ${x.p}</span>`;
}
const liveGrid=a=>`<div class="live">${TURMAS.map((t,j)=>`<div style="border-color:${TC[t]}"><small style="color:${TC[t]}">${t}</small>${a[j]}</div>`).join("")}</div>`;

function heroHTML(d,L,aulas,hoje){
  const ag=agoraMin();
  const quem=prof&&turma?`${prof} no ${turma}`:prof?prof:turma?`Turma ${turma}`:"Todas as turmas";
  if(hoje&&aulas.length){
    const atual=aulas.find(l=>ag>=mn(l.i)&&ag<mn(l.f));
    const prox=aulas.find(l=>mn(l.i)>ag);
    const pausa=L.find(l=>l.b&&ag>=mn(l.i)&&ag<mn(l.f));
    if(atual)return`<div class="hero now" data-tilt><div class="ic">${I.play("#fff")}</div><div class="grow"><div class="k">Agora · ${quem}</div><div class="v">${alvoTxt(atual)}</div><div class="s">${f(atual.i)} → ${f(atual.f)}${prox?` · depois: ${f(prox.i)}`:" · última aula do dia"}</div></div><div class="cd"><span data-cd="${mn(atual.f)*60}">--</span><small>restam</small></div><span class="prog" data-ps="${mn(atual.i)*60}" data-pe="${mn(atual.f)*60}"></span></div>`;
    if(prox){const ini=Math.max(...L.filter(l=>mn(l.f)<=mn(prox.i)).map(l=>mn(l.f)),mn(prox.i)-60);
      return`<div class="hero next" data-tilt><div class="ic">${I.clock("#fff")}</div><div class="grow"><div class="k">${pausa?pausa.n+" · ":""}Próxima · ${quem}</div><div class="v">${alvoTxt(prox)}</div><div class="s">Começa às ${f(prox.i)}</div></div><div class="cd"><span data-cd="${mn(prox.i)*60}">--</span><small>para começar</small></div><span class="prog" data-ps="${ini*60}" data-pe="${mn(prox.i)*60}"></span></div>`}
    return`<div class="hero done" data-tilt><div class="ic">${I.check("#7f7d8c")}</div><div><div class="k">${quem}</div><div class="v">Aulas de hoje encerradas</div><div class="s">A última terminou às ${f(aulas[aulas.length-1].f)}${dia<DIAS.length-1?` · amanhã: ${DIAS[dia+1].sem}, ${DIAS[dia+1].dt}`:""}</div></div></div>`;
  }
  if(!aulas.length)return`<div class="hero info" data-tilt><div class="ic">${I.check("#6b4fbb")}</div><div><div class="k">${d.sem} · ${d.dt}</div><div class="v">${quem} não tem aula neste dia</div><div class="s">Escolha outro dia acima ↑</div></div></div>`;
  const hj=isoHoje();let antes="";
  if(hj<DIAS[0].iso){const n=Math.round((new Date(DIAS[0].iso+"T12:00")-new Date(hj+"T12:00"))/864e5);antes=` · começa ${n===1?"amanhã":`em ${n} dias`}`}
  return`<div class="hero info" data-tilt><div class="ic">${I.cal("#6b4fbb")}</div><div><div class="k">${d.sem} · ${d.dt}${antes}</div><div class="v">${quem}</div><div class="s">${prof||turma?`${aulas.length} aula${aulas.length>1?"s":""} das ${f(aulas[0].i)} às ${f(aulas[aulas.length-1].f)}`:`${NAULAS} aulas por turma · das ${f(INI)} às ${f(FIM)}`}</div></div></div>`;
}

function weekHTML(){
  if(!prof)return"";
  return`<div class="week">${DIAS.map((d,i)=>{const c=contaDia(i);return`<button class="wk${i===dia?" on":""}" data-tilt data-i="${i}"><small>${d.sem}</small><b>${c} aula${c!==1?"s":""}</b><div class="bars">${d.a.map(a=>{const tem=turma?a[TURMAS.indexOf(turma)]===prof:a.includes(prof);return`<i style="${tem?`background:${DCOR[i]}`:""}"></i>`}).join("")}</div></button>`}).join("")}</div>`;
}

function timelineHTML(L,hoje){
  const ag=agoraMin();let marcouProx=false,k=0;
  return`<div class="card">`+L.map(l=>{
    k++;
    if(l.b){const nw=hoje&&ag>=mn(l.i)&&ag<mn(l.f);return`<div class="row brk${hoje&&ag>=mn(l.f)?" past":""}" style="--k:${k}"><div class="tm"><small>${f(l.i)}</small></div><div class="rail"><span class="dot"${nw?` style="border-color:var(--next);background:var(--next)"`:""}></span></div><div class="body"><div class="item">${I[l.b]}<span>${l.n} · até ${f(l.f)}</span></div></div></div>`}
    let st="",tag="",pb="";
    if(hoje){
      if(ag>=mn(l.f))st="past";
      else if(ag>=mn(l.i)){st=l.tem?"now":"";if(l.tem){tag=`<span class="tag">● agora</span>`;pb=`<span class="pb" data-ps="${mn(l.i)*60}" data-pe="${mn(l.f)*60}"></span>`}}
      else if(l.tem&&!marcouProx){st="next";tag=`<span class="tag">próxima ↓</span>`;marcouProx=true}
    }
    let it=itemHTML(l).replace("TAG",tag);
    if(pb)it=it.replace(/<\/div>$/,pb+"</div>");
    if(l.info.all&&tag)it=`<div style="width:100%"><div style="margin-bottom:5px">${tag}</div>${it}</div>`;
    if(l.ob)it+=`<span class="rmk">${I.meet.replace('width="20" height="20"','width="12" height="12"')} ${l.ob.txt}</span>`;
    const cor=l.tem&&!l.info.all?(l.info.t?TC[l.info.t]:TC[l.info.ts[0]]):"";
    return`<div class="row ${st}${l.k===slotSel?" sel":""}" data-s="${l.k}" style="--k:${k}"><div class="tm"><b>${f(l.i)}</b><small>até ${f(l.f)}</small></div><div class="rail"><span class="dot"${cor&&st!=="now"?` style="border-color:${cor}"`:""}></span></div><div class="body">${it}</div></div>`;
  }).join("")+`</div>`;
}

function gradeHTML(L,hoje){
  const ag=agoraMin(),flt=!!(prof||turma);
  return`<div class="card" style="padding:8px 6px"><table class="tbl${flt?" flt":""}"><thead><tr><th></th>${TURMAS.map(t=>`<th>${tb(t)}</th>`).join("")}</tr></thead><tbody>`+
  L.map(l=>{
    if(l.b)return`<tr class="bk"><td class="h">${f(l.i)}</td><td colspan="${TURMAS.length}">${l.n}</td></tr>`;
    const cls=hoje?(ag>=mn(l.f)?"ps":ag>=mn(l.i)?"nw":""):"";
    return`<tr class="${cls}${l.k===slotSel?" sl":""}" data-s="${l.k}"><td class="h">${f(l.i)}</td>${l.a.map((p,j)=>{
      const t=TURMAS[j];const me=(prof&&turma)?(p===prof&&t===turma):prof?p===prof:turma?t===turma:false;
      return`<td class="${me?"me":""}${l.ob?" mt":""}" style="${me?`background:${prof?pc(p):TC[t]}`:""}" title="${t} · ${p}">${p}</td>`}).join("")}</tr>`;
  }).join("")+`</tbody></table></div>`;
}

/* ---------- NA SALA: quem está em cada sala on-line no horário ---------- */
function salaHTML(L,hoje){
  const ag=agoraMin(),aulasT=L.filter(l=>!l.b);
  let l=null,modoS="";
  if(slotSel!==null){l=aulasT.find(x=>x.k===slotSel);modoS="sel"}
  else if(hoje){
    l=aulasT.find(x=>ag>=mn(x.i)&&ag<mn(x.f));modoS="live";
    if(!l){l=aulasT.find(x=>mn(x.i)>ag);modoS="prox"}
    if(!l)return"";
  }else{l=aulasT[0];modoS="first"}
  const live=modoS==="live"||(modoS==="sel"&&hoje&&ag>=mn(l.i)&&ag<mn(l.f));
  const nx=aulasT.find(x=>x.k===l.k+1);
  const titulo=live?"Na sala agora":modoS==="prox"?"Próximos na sala":modoS==="first"?"Primeira aula do dia":"Na sala neste horário";
  const badge=live?`<span class="onair"><i></i>AO VIVO</span>`:`<span class="when">${modoS==="prox"?"em breve":f(l.i)}</span>`;
  const turmasV=turma?[turma]:TURMAS;
  const rooms=turmasV.map(t=>{
    const j=TURMAS.indexOf(t),p=l.a[j],dep=nx?nx.a[j]:null;
    const me=prof&&p===prof,dim=prof&&!turma&&p!==prof;
    return`<div class="room${me?" me":""}${dim?" dim":""}" data-tilt style="--c:${TC[t]}"><div class="rt">${tb(t)}${live?`<span class="lv" title="ao vivo"></span>`:""}</div><span class="ring">${av(p,0).replace('class="av"','class="av big"')}</span><div class="inf"><div class="tag1">${tb(t)}${live?`<span class="onair"><i></i>AO VIVO</span>`:""}</div><b>${p}</b><small>${dep?`depois: ${dep}`:"última aula"}</small></div></div>`;
  }).join("");
  const nota=prof&&!turma?(l.a.includes(prof)?`${prof} está na sala ${TURMAS.filter((t,j)=>l.a[j]===prof).join(" e ")} neste horário`:`${prof} está sem aula neste horário`):"Toque em um horário abaixo para ver quem estará na sala";
  return`<div class="sala${live?" aov":""}"><div class="sh">${badge}<h2>${titulo}</h2><span class="tm2">${f(l.i)} – ${f(l.f)}</span>${slotSel!==null?`<button class="x" data-clr>${hoje?"voltar para agora":"limpar"} ✕</button>`:""}</div><div class="rooms${turma?" one":""}">${rooms}</div><p class="nt">${nota}</p></div>`;
}

function render(anim,slide){
  const d=DIAS[dia],L=linhas(),hoje=d.iso===isoHoje();
  const aulas=L.filter(l=>!l.b&&l.tem);
  let h=heroHTML(d,L,aulas,hoje)+salaHTML(L,hoje);
  (d.obs||[]).forEach(o=>{
    const meu=prof&&o.quem&&o.quem.includes(prof);
    h+=`<div class="obs${meu?" me":""}" data-tilt><div class="ic" style="color:var(--meet)">${I.meet}</div><div><b>${o.txt}</b><small>${f(o.i)} às ${f(o.f)}${meu?" · você participa":""}</small></div></div>`;
  });
  h+=weekHTML();
  h+=modo==="gd"?gradeHTML(L,hoje):timelineHTML(L,hoje);

  $("tip").innerHTML=prof||turma?"":`↑ Escolha um professor ou toque numa turma para ver só as aulas dele(a)`;
  const O=$("out");
  const put=()=>{O.innerHTML=h;O.classList.toggle("anim",!!anim);O.classList.remove("fade","sl","enter");tick()};
  if(slide){put();void O.offsetWidth;O.classList.add("enter");setTimeout(()=>O.classList.remove("enter"),600)}
  else if(anim){O.classList.add("fade");setTimeout(put,130)}
  else put();
  days();atualizaLink();
}

/* ---------- dígitos que giram ao mudar ---------- */
function flipTxt(el,txt){
  const old=el.dataset.v||"";if(old===txt)return;el.dataset.v=txt;
  if(el.children.length!==txt.length){el.innerHTML=[...txt].map(c=>`<span class="flip">${c}</span>`).join("");return}
  [...txt].forEach((c,i)=>{const sp=el.children[i];if(sp.textContent!==c){sp.textContent=c;sp.classList.remove("go");void sp.offsetWidth;sp.classList.add("go")}});
}

/* ---------- inclinação 3D com reflexo (mouse e toque) ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let tiltEl=null;
function tiltMove(e){
  if(RM)return;
  const el=e.target.closest&&e.target.closest("[data-tilt]");
  if(tiltEl&&tiltEl!==el)tiltReset(tiltEl);
  if(!el)return;tiltEl=el;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const max=el.classList.contains("room")?14:el.classList.contains("wk")?12:6;
  el.classList.add("tilting");
  el.style.setProperty("--ry",((x-.5)*2*max).toFixed(2)+"deg");
  el.style.setProperty("--rx",((.5-y)*2*max).toFixed(2)+"deg");
  el.style.setProperty("--gx",(x*100).toFixed(1)+"%");el.style.setProperty("--gy",(y*100).toFixed(1)+"%");el.style.setProperty("--go",1);
}
function tiltReset(el){el.classList.remove("tilting");["--rx","--ry"].forEach(v=>el.style.setProperty(v,"0deg"));el.style.setProperty("--go",0);if(tiltEl===el)tiltEl=null}
document.addEventListener("pointermove",tiltMove,{passive:true});
document.addEventListener("pointerdown",tiltMove,{passive:true});
document.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse"&&tiltEl)tiltReset(tiltEl)},{passive:true});
document.addEventListener("pointerleave",()=>tiltEl&&tiltReset(tiltEl));
document.addEventListener("pointerout",e=>{if(tiltEl&&!e.relatedTarget?.closest?.("[data-tilt]"))tiltReset(tiltEl)});

/* ---------- fundo com profundidade (paralaxe) ---------- */
const OR=document.querySelector(".orbs");
if(!RM){
  addEventListener("pointermove",e=>{OR.style.setProperty("--px",(e.clientX/innerWidth-.5).toFixed(3));OR.style.setProperty("--py",(e.clientY/innerHeight-.5).toFixed(3))},{passive:true});
  addEventListener("scroll",()=>OR.style.setProperty("--sy",(scrollY/300).toFixed(3)),{passive:true});
  addEventListener("deviceorientation",e=>{if(e.gamma==null)return;OR.style.setProperty("--px",(e.gamma/60).toFixed(3));OR.style.setProperty("--py",((e.beta-45)/60).toFixed(3))},{passive:true});
}

/* ---------- relógio e contagem regressiva (a cada segundo) ---------- */
function tick(){
  const d=new Date(),s=agoraSeg();
  flipTxt($("clock").querySelector("span"),String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"));
  document.querySelectorAll("[data-cd]").forEach(e=>{const r=+e.dataset.cd-s;if(r<=0){render();return}flipTxt(e,mmss(r))});
  document.querySelectorAll("[data-ps]").forEach(e=>{const a=+e.dataset.ps,b=+e.dataset.pe;e.style.width=Math.min(100,Math.max(0,(s-a)/(b-a)*100))+"%"});
}

/* ---------- link direto (#mari, #3b, #mari-1b), WhatsApp e copiar ---------- */
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"");
function lerHash(){
  const h=norm(decodeURIComponent(location.hash.slice(1)));
  if(!h)return false;
  let p=null,t=null;
  h.split("-").forEach(x=>{const tt=TURMAS.find(v=>slug(v)===x);if(tt)t=tt;const pp=PROFS.find(v=>slug(v)===x);if(pp)p=pp});
  if(!p&&!t)return false;
  prof=p;turma=t;save();return true;
}
function linkBase(){
  const h=location.hostname;
  if(!/^https?:/.test(location.protocol)||/claude|anthropic/.test(h))return "https://aulas-on-line.vercel.app/";
  return location.origin+location.pathname;
}
let linkAtual="";
function atualizaLink(){
  const tag=[prof&&slug(prof),turma&&slug(turma)].filter(Boolean).join("-");
  try{history.replaceState(null,"","#"+tag)}catch(e){}
  linkAtual=linkBase()+(tag?"#"+tag:"");
  const quem=prof&&turma?`${prof} no ${turma}`:prof?prof:turma?`turma ${turma}`:"";
  const txt=(quem?`📅 Aulas on-line de *${quem}* (${PERIODO}):\n`:`📅 Cronograma de aulas on-line (${PERIODO}) — toque e escolha seu nome ou turma:\n`)+linkAtual;
  const a=$("share");
  a.href="https://wa.me/?text="+encodeURIComponent(txt);
  a.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
    <span>Enviar no WhatsApp<br><small>${quem?`link direto para ${quem}`:"cronograma completo"}</small></span>`;
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(linkAtual);toast("Link copiado ✓")}catch(e){prompt("Copie o link:",linkAtual)}};
$("out").addEventListener("click",e=>{
  const w=e.target.closest(".wk");if(w)return irDia(+w.dataset.i);
  if(e.target.closest("[data-clr]")){slotSel=null;render();return scrollTo({top:0,behavior:"smooth"})}
  const r=e.target.closest("[data-s]");
  if(r){const k=+r.dataset.s;slotSel=slotSel===k?null:k;render();document.querySelector(".sala")?.scrollIntoView({behavior:"smooth",block:"center"})}
});
